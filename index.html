<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1917">
<title>Bodega R-56 — Dashboard</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1917;
    --card: #262320;
    --card-border: #3A3530;
    --tomate: #D8492F;
    --tomate-dim: #7A2E1F;
    --tallo: #6B8F5C;
    --ambar: #E0A526;
    --dorado: #D4AF37;
    --dorado-dim: #8A6E1F;
    --text: #F3EEE4;
    --text-dim: #A69C8C;

    /* Paleta clara — pantalla del Dashboard */
    --crema: #F3EEE4;
    --crema-carta: #FFFFFF;
    --crema-borde: #E4DCC8;
    --tinta: #241F1A;
    --tinta-dim: #837A6B;
    --rojo: #C0392B;
    --oro: #B8912A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100dvh;
  }

  #dashboard-view {
    background: var(--crema);
    color: var(--tinta);
    min-height: 100dvh;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }

  .dash-inner {
    max-width: 480px;
    margin: 0 auto;
  }

  /* --- Barra superior oscura, hace juego con la pantalla de acceso --- */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: var(--bg);
    padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  }

  .marca {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.16em;
    color: var(--dorado);
    text-transform: uppercase;
  }

  #fecha-label {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 600;
    text-transform: capitalize;
    margin-top: 4px;
    color: var(--text);
  }

  /* --- Sello: estado de sincronización, guiño al vale sellado del negocio --- */
  .sello-wrap { display: flex; align-items: center; }
  #sello {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--tallo);
    border: 2px solid var(--tallo);
    border-radius: 50%;
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
    transform: rotate(-8deg);
    padding: 4px;
  }
  #sello.sello--offline {
    color: var(--ambar);
    border-color: var(--ambar);
  }

  button#refrescar {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 20px;
    padding: 8px;
    margin-left: 4px;
    cursor: pointer;
    transition: transform 0.4s ease;
  }
  button#refrescar.girando { transform: rotate(360deg); }

  #error-box {
    margin: 16px 20px 0;
    padding: 10px 14px;
    background: #FBEFD9;
    border: 1px solid var(--oro);
    color: #7A5A0F;
    font-size: 13px;
    border-radius: 10px;
  }
  #error-box[hidden] { display: none; }

  /* --- Tarjetas planas con acento de color, estilo "cifra de negocio" --- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 20px 0;
  }
  .stat {
    background: var(--crema-carta);
    border: 1px solid var(--crema-borde);
    border-bottom: 4px solid var(--tinta);
    border-radius: 12px;
    padding: 16px 16px 14px;
  }
  .stat-label {
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--tinta-dim);
    font-weight: 700;
  }
  .stat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    margin-top: 3px;
    color: var(--tinta);
  }
  .stat-sub {
    font-size: 11.5px;
    color: var(--tinta-dim);
    margin-top: 2px;
  }

  .stat--cajas { grid-column: span 2; border-bottom-color: var(--tinta); }
  .stat--cajas .stat-val { font-size: 46px; }

  .stat--contado { border-bottom-color: var(--rojo); }
  .stat--contado .stat-val { color: var(--rojo); }

  .stat--credito { border-bottom-color: var(--oro); }
  .stat--credito .stat-val { color: var(--oro); }

  .stat--cobranza { border-bottom-color: var(--tinta); }

  .stat--gastos { border-bottom-color: var(--rojo); }
  .stat--gastos .stat-val { color: var(--rojo); }

  .stat--efectivo {
    grid-column: span 2;
    border-bottom-color: var(--oro);
    background: #FFFCF3;
  }
  .stat--efectivo .stat-val { color: var(--oro); font-size: 32px; }

  /* --- Manifiestos abiertos --- */
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 26px 20px 8px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--tinta);
  }
  #manifiestos-count { font-size: 12px; color: var(--tinta-dim); }

  ul#manifiestos-lista {
    list-style: none;
    margin: 0 20px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ticket {
    background: var(--crema-carta);
    border: 1px dashed var(--crema-borde);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .ticket-carro {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--rojo);
  }
  .ticket-agricultor { color: var(--tinta-dim); }
  li.vacio {
    color: var(--tinta-dim);
    font-size: 14px;
    padding: 20px 14px;
    text-align: center;
    background: var(--crema-carta);
    border: 1px dashed var(--crema-borde);
    border-radius: 10px;
  }

  #actualizado {
    margin: 22px 20px 0;
    font-size: 12px;
    color: var(--tinta-dim);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    button#refrescar { transition: none; }
  }

  /* ============ PANTALLA DE LOGIN ============ */
  #login-view {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 0%, rgba(212,175,55,0.06), transparent 60%),
      var(--bg);
  }
  #login-view[hidden] { display: none; }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(165deg, #221F1B 0%, #16140F 100%);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 18px;
    padding: 36px 28px 28px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 56px; height: 3px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(90deg, var(--dorado-dim), var(--dorado));
  }

  .login-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dorado);
    text-align: center;
    font-weight: 700;
  }
  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    margin: 6px 0 4px;
    color: var(--text);
  }
  .login-sub {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 26px;
  }

  .login-field { margin-bottom: 16px; }
  .login-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    background: #14120E;
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 15px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }
  .login-field input:focus {
    outline: none;
    border-color: var(--dorado);
  }

  #login-error {
    color: #E88A6B;
    font-size: 13px;
    text-align: center;
    margin: -4px 0 14px;
    min-height: 16px;
  }

  button#login-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #E8C766, var(--dorado) 60%, #B8912A);
    color: #1B1917;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button#login-submit:disabled { opacity: 0.6; }

  #dashboard-view[hidden] { display: none; }
</style>
</head>
<body>

  <section id="login-view">
    <form class="login-card" id="login-form">
      <div class="login-eyebrow">Sistema · Acceso</div>
      <div class="login-title">Bienvenido</div>
      <div class="login-sub">Ingresa tus credenciales para continuar</div>

      <div class="login-field">
        <label for="login-usuario">Usuario</label>
        <input type="text" id="login-usuario" autocomplete="username" autocapitalize="off" required>
      </div>
      <div class="login-field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>

      <div id="login-error"></div>

      <button type="submit" id="login-submit">Iniciar sesión</button>
    </form>
  </section>

  <div id="dashboard-view" hidden>
  <div class="dash-inner">

  <div class="top">
    <div>
      <div class="marca">Bodega R-56</div>
      <div id="fecha-label">—</div>
    </div>
    <div class="sello-wrap">
      <button id="refrescar" aria-label="Actualizar">⟳</button>
      <div id="sello">AL DÍA</div>
    </div>
  </div>

  <div id="error-box" hidden></div>

  <div class="grid">
    <div class="stat stat--cajas">
      <div class="stat-label">Cajas vendidas hoy</div>
      <div class="stat-val" id="hero-cajas">0</div>
      <div class="stat-sub" id="hero-sub">—</div>
    </div>
    <div class="stat stat--contado">
      <div class="stat-label">Contado</div>
      <div class="stat-val" id="stat-contado">$0</div>
    </div>
    <div class="stat stat--credito">
      <div class="stat-label">Crédito</div>
      <div class="stat-val" id="stat-credito">$0</div>
    </div>
    <div class="stat stat--cobranza">
      <div class="stat-label">Cobranza del día</div>
      <div class="stat-val" id="stat-cobranza">$0</div>
    </div>
    <div class="stat stat--gastos">
      <div class="stat-label">Gastos</div>
      <div class="stat-val" id="stat-gastos">$0</div>
    </div>
    <div class="stat stat--efectivo">
      <div class="stat-label">Efectivo estimado</div>
      <div class="stat-val" id="stat-efectivo">$0</div>
    </div>
  </div>

  <div class="section-head">
    <div class="section-title">Camiones abiertos</div>
    <div id="manifiestos-count">—</div>
  </div>
  <ul id="manifiestos-lista"></ul>

  <div id="actualizado">—</div>

  </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
